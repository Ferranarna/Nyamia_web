# Local Postgres for the website API only. Host port 5433 so it never clashes
# with the product's dev database on 5432. Credentials come from apps/api/.env
# (`make api-db-up` passes it with --env-file).
name: nyamia-web-api

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in apps/api/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in apps/api/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in apps/api/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nyamia_web_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nyamia_web_pgdata:
