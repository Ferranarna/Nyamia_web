[project]
name = "nyamia-web-api"
version = "0.1.0"
description = "Nyamia website API: demo-request intake (FastAPI, hexagonal)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: needs the local Postgres (skipped when unreachable)"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "S", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# S101: asserts are the pytest idiom. S105/S106: fixture secrets are fake.
"tests/**" = ["S101", "S105", "S106"]
